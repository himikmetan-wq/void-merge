<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VOID MERGE — Prototype</title>
<style>
:root{--bg:#06101f;--panel:#0b1830;--line:#1d3760;--txt:#eef6ff;--muted:#91a7c8;--cyan:#55d9ff;--vio:#8f62ff;--orange:#ff9c38}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 20%,#13254a 0,#07101f 42%,#030812 100%);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Arial;overflow:hidden}
body{display:flex;flex-direction:column}
.top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px}
.logo{font-weight:900;letter-spacing:.18em;font-size:20px}.logo span{color:#7b83ff}
.stat{display:flex;gap:10px}.pill{background:rgba(8,18,38,.72);border:1px solid #27466f;border-radius:16px;padding:8px 12px;min-width:96px;text-align:center;box-shadow:inset 0 0 18px rgba(84,139,255,.06),0 8px 20px rgba(0,0,0,.2)}
.pill b{display:block;font-size:20px}.pill small{color:var(--muted);font-size:10px;letter-spacing:.12em}
.main{flex:1;display:grid;grid-template-columns:170px 1fr 170px;min-height:0}
.side{padding:12px}.card{background:rgba(8,18,38,.62);border:1px solid #203e68;border-radius:18px;padding:14px;backdrop-filter:blur(10px)}
.side h3{font-size:12px;color:#b7c8e2;letter-spacing:.12em;margin:0 0 10px}
.levels{display:flex;flex-direction:column;gap:8px}.lvl{display:flex;align-items:center;gap:9px;font-weight:800}.orbMini{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 10px rgba(255,255,255,.5),0 0 12px currentColor}
.arrow{text-align:center;color:#50698e;font-size:12px}
.gameWrap{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
canvas{width:min(72vh,72vw);height:min(72vh,72vw);max-width:100%;max-height:100%;display:block;touch-action:none;filter:drop-shadow(0 24px 55px rgba(0,0,0,.4))}
.nextOrb{width:74px;height:74px;border-radius:50%;margin:12px auto 4px;display:grid;place-items:center;font-size:28px;font-weight:900;box-shadow:inset 0 0 20px rgba(255,255,255,.55),0 0 25px currentColor}
.btn{width:100%;border:1px solid #2d5385;background:linear-gradient(180deg,#15345f,#0b2447);color:white;border-radius:14px;padding:12px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #07152a;margin-top:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #07152a}
.help{font-size:12px;color:var(--muted);line-height:1.5}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,6,14,.62);backdrop-filter:blur(5px)}
.overlay.show{display:flex}.modal{width:min(420px,86%);background:#0b1830;border:1px solid #31517d;border-radius:24px;padding:28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.modal h2{font-size:36px;margin:0 0 8px}.modal p{color:var(--muted)}.modal .big{font-size:46px;font-weight:900;margin:10px 0}
.back{position:fixed;left:14px;bottom:14px;text-decoration:none;color:#dceaff;background:rgba(8,18,38,.82);border:1px solid #284975;padding:10px 13px;border-radius:14px;font-weight:800}
@media(max-width:820px){
 .main{grid-template-columns:1fr}.side.left{display:none}.side.right{position:absolute;right:8px;top:78px;width:128px;z-index:4;padding:0}.side.right .card{padding:9px}.side.right .help{display:none}.nextOrb{width:52px;height:52px;font-size:20px}.top{height:64px}.pill{min-width:76px;padding:6px 8px}.pill b{font-size:17px}.logo{font-size:15px}
 canvas{width:min(92vw,76vh);height:min(92vw,76vh)}
}
</style>
</head>
<body>
<div class="top">
  <div class="logo">VOID <span>MERGE</span></div>
  <div class="stat">
    <div class="pill"><small>SCORE</small><b id="score">0</b></div>
    <div class="pill"><small>BEST</small><b id="best">0</b></div>
  </div>
</div>
<div class="main">
  <aside class="side left"><div class="card">
    <h3>ЭВОЛЮЦИЯ</h3>
    <div class="levels" id="levels"></div>
  </div></aside>

  <main class="gameWrap">
    <canvas id="game" width="760" height="760"></canvas>
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>GAME OVER</h2>
        <p>Финальный счёт</p>
        <div class="big" id="finalScore">0</div>
        <button class="btn" onclick="restart()">ЕЩЁ РАЗ</button>
      </div>
    </div>
  </main>

  <aside class="side right"><div class="card">
    <h3>NEXT</h3>
    <div class="nextOrb" id="nextOrb">1</div>
    <div class="help">Нажми или коснись поля, чтобы сбросить сферу. Одинаковые сферы при касании объединяются.</div>
    <button class="btn" onclick="restart()">РЕСТАРТ</button>
  </div></aside>
</div>
<a class="back" href="index.html">← Карта проекта</a>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=canvas.width,H=canvas.height,CX=W/2,CY=H/2+18,R=315;
const values=[1,2,4,8,16,32,64,128];
const radii=[25,31,38,46,55,66,78,92];
const colors=['#d8e8ff','#7be6ff','#42a9ff','#8e62ff','#ff9c38','#ff5f68','#ffdc5e','#73ffb0'];
let balls=[],score=0,best=+(localStorage.getItem('voidmerge-best')||0),nextVal=1,gameOver=false,dropCooldown=0;
document.getElementById('best').textContent=best;

const lev=document.getElementById('levels');
values.slice(0,6).forEach((v,i)=>{lev.innerHTML+=`<div class="lvl"><div class="orbMini" style="background:${colors[i]};color:${colors[i]}"></div><span>${v}</span></div>${i<5?'<div class="arrow">↓</div>':''}`});

function radiusFor(v){return radii[Math.max(0,values.indexOf(v))]||92}
function colorFor(v){return colors[Math.max(0,values.indexOf(v))]||'#fff'}
function newBall(x,y,v){
 return {x,y,v,r:radiusFor(v),vx:(Math.random()-.5)*.8,vy:0,merged:false,flash:0}
}
function pickNext(){
 const p=Math.random();
 nextVal=p<.62?1:p<.9?2:4;
 const n=document.getElementById('nextOrb');n.textContent=nextVal;n.style.background=colorFor(nextVal);n.style.color='#fff';
}
pickNext();

function dropAt(clientX){
 if(gameOver||dropCooldown>0)return;
 const rect=canvas.getBoundingClientRect();
 let x=(clientX-rect.left)/rect.width*W;
 x=Math.max(CX-R+36,Math.min(CX+R-36,x));
 balls.push(newBall(x,CY-R+55,nextVal));
 dropCooldown=22;
 pickNext();
}
canvas.addEventListener('pointerdown',e=>dropAt(e.clientX));

function mergePair(a,b){
 if(a.merged||b.merged||a.v!==b.v)return false;
 const nv=a.v*2,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
 a.merged=b.merged=true;
 balls.push({...newBall(mx,my,nv),vy:-2.5,flash:12});
 score+=nv; document.getElementById('score').textContent=score;
 if(score>best){best=score;localStorage.setItem('voidmerge-best',best);document.getElementById('best').textContent=best}
 return true;
}
function update(){
 if(gameOver)return;
 if(dropCooldown>0)dropCooldown--;
 const g=.22;
 for(const b of balls){
   b.vy+=g;b.vx*=.995;b.vy*=.998;b.x+=b.vx;b.y+=b.vy;if(b.flash>0)b.flash--;
   const dx=b.x-CX,dy=b.y-CY,d=Math.hypot(dx,dy);
   if(d+b.r>R){
     const nx=dx/(d||1),ny=dy/(d||1),over=d+b.r-R;
     b.x-=nx*over;b.y-=ny*over;
     const dot=b.vx*nx+b.vy*ny;
     if(dot>0){b.vx-=1.65*dot*nx;b.vy-=1.65*dot*ny}
     b.vx*=.87;b.vy*=.87;
   }
 }
 for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
   const a=balls[i],b=balls[j]; if(a.merged||b.merged)continue;
   let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;
   if(d<min){
     if(a.v===b.v && d<min*.86){mergePair(a,b);continue}
     const nx=dx/d,ny=dy/d,over=min-d;
     a.x-=nx*over*.5;a.y-=ny*over*.5;b.x+=nx*over*.5;b.y+=ny*over*.5;
     const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
     if(rv<0){const imp=-rv*.52;a.vx-=imp*nx;a.vy-=imp*ny;b.vx+=imp*nx;b.vy+=imp*ny}
   }
 }
 balls=balls.filter(b=>!b.merged);
 // game over: sphere rests near top danger band
 let danger=false;
 for(const b of balls){
   if(b.y-b.r < CY-R+24 && Math.abs(b.vy)<1.1){danger=true;break}
 }
 if(danger && balls.length>7){endGame()}
}
function endGame(){gameOver=true;document.getElementById('finalScore').textContent=score;document.getElementById('overlay').classList.add('show')}
function restart(){balls=[];score=0;gameOver=false;dropCooldown=0;document.getElementById('score').textContent='0';document.getElementById('overlay').classList.remove('show');pickNext()}
window.restart=restart;

function drawOrb(b){
 const grad=ctx.createRadialGradient(b.x-b.r*.28,b.y-b.r*.35,b.r*.12,b.x,b.y,b.r);
 grad.addColorStop(0,'#ffffff');grad.addColorStop(.18,colorFor(b.v));grad.addColorStop(1,'#07101d');
 ctx.save();
 ctx.shadowColor=colorFor(b.v);ctx.shadowBlur=22;
 ctx.fillStyle=grad;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
 ctx.shadowBlur=0;
 ctx.globalAlpha=.55;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r-3,0,Math.PI*2);ctx.stroke();
 ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(18,b.r*.65)}px Inter,Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.v,b.x,b.y+2);
 if(b.flash>0){ctx.globalAlpha=b.flash/12;ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.arc(b.x,b.y,b.r+12+(12-b.flash)*4,0,Math.PI*2);ctx.stroke()}
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createRadialGradient(CX,CY,40,CX,CY,R+50);bg.addColorStop(0,'#102553');bg.addColorStop(1,'#020813');
 ctx.fillStyle=bg;ctx.beginPath();ctx.arc(CX,CY,R+28,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.shadowColor='#4e81ff';ctx.shadowBlur=28;ctx.lineWidth=18;ctx.strokeStyle='#102a50';ctx.beginPath();ctx.arc(CX,CY,R+8,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=10;ctx.lineWidth=5;ctx.strokeStyle='#5fa8ff';ctx.stroke();ctx.restore();
 ctx.strokeStyle='rgba(96,157,255,.18)';ctx.lineWidth=1;
 for(let rr=90;rr<R;rr+=70){ctx.beginPath();ctx.arc(CX,CY,rr,0,Math.PI*2);ctx.stroke()}
 ctx.beginPath();for(let a=0;a<Math.PI*2;a+=Math.PI/6){ctx.moveTo(CX,CY);ctx.lineTo(CX+Math.cos(a)*R,CY+Math.sin(a)*R)}ctx.stroke();
 // danger line
 ctx.save();ctx.strokeStyle='rgba(255,100,115,.55)';ctx.setLineDash([10,10]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(CX,CY,R-20,Math.PI*1.12,Math.PI*1.88);ctx.stroke();ctx.restore();
 balls.sort((a,b)=>a.r-b.r).forEach(drawOrb);
 requestAnimationFrame(loop);
}
function loop(){update();draw()}
loop();
</script>
</body>
</html>
