<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>VOID MERGE</title>
  <link rel="stylesheet" href="styles/game.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js", "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/+esm" } }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <div id="hud">
      <header class="top">
        <div class="brand"><span class="v">V<i></i>ID</span><span class="m">MERGE</span></div>
        <div class="scores">
          <div class="score-box"><div class="lbl">SCORE</div><div id="score" class="val">0</div></div>
          <div class="sep"></div>
          <div class="best-box"><div class="lbl"><span class="cup"></span>BEST</div><div id="best" class="val gold">0</div></div>
        </div>
        <button id="btnPause" class="icon-btn" aria-label="Пауза"><span class="pause-ico"></span></button>
      </header>

      <aside class="evo glass" id="evo" aria-label="Эволюция сфер"></aside>

      <aside class="right">
        <div class="panel glass next">
          <div class="lbl">NEXT</div>
          <div id="nextIcon" class="icon-slot"></div>
        </div>
        <div class="panel glass now">
          <div class="lbl">NOW</div>
          <div id="nowIcon" class="icon-slot"></div>
        </div>
      </aside>

      <footer class="bottom">
        <button id="btnCam" class="icon-btn" aria-label="Сброс камеры" title="Сброс камеры (C)"><span class="cam-ico"></span></button>
        <div id="hint" class="hint glass"></div>
        <button id="btnDrop" class="drop-btn" aria-label="Сбросить сферу">DROP</button>
      </footer>

      <div id="floats"></div>
      <div id="combo"></div>
      <div id="critical" class="hidden"><div class="t">CRITICAL MASS</div><div class="n">3</div></div>
      <div id="overlay" class="hidden"></div>
    </div>

    <div id="boot"><div class="boot-ring"></div><div class="boot-text">Загрузка реактора…</div></div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
